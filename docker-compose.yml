services:
  autodj:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autodj
    restart: unless-stopped
    ports:
      - "8095:8095"
    volumes:
      - ./app:/app
      - ./input:/app/input
      - ./output:/app/output
    stdin_open: true
    tty: true
    working_dir: /app
    command: uvicorn web:app --host 0.0.0.0 --port 8095 --reload
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
